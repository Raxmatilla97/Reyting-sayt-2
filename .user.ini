open_basedir=/www/wwwroot/otm.cspu.uz/2025/:/tmp/

; PHP кonfigурatsiya файл Excel export учун
memory_limit = 16G
max_execution_time = 0
max_input_time = 0
post_max_size = 2G
upload_max_filesize = 2G

; MySQL sozlamalari
mysql.connect_timeout = 300
default_socket_timeout = 300

; Xotira optimizatsiyasi
pcre.backtrack_limit = 5000000
pcre.recursion_limit = 5000000

; Excel fayl uchun
max_file_uploads = 200
auto_detect_line_endings = On

; Output buffering
output_buffering = Off

; Garbage collection
zend.enable_gc = On